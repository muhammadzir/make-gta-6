<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Solmar Bay 3D — an open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1210; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #f2f0e8; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui button { pointer-events: auto; }
  .hud { position: absolute; inset: 0; }
  .hud-money { position: absolute; top: 14px; right: 18px; font-size: 28px; font-weight: 800; color: #4ac25a; text-shadow: 0 2px 6px #000; }
  .hud-bars { position: absolute; top: 14px; left: 16px; width: 240px; }
  .bar { height: 14px; background: rgba(0,0,0,.55); border: 1px solid #fff3; margin-bottom: 5px; }
  .bar .fill { height: 100%; background: #4ac25a; }
  .bar.armor .fill { background: #4c6be8; }
  .hud-stars { position: absolute; top: 52px; left: 16px; font-size: 24px; color: #ffcf3a; text-shadow: 0 2px 6px #000; letter-spacing: 2px; }
  .hud-district { position: absolute; bottom: 14px; right: 18px; font-size: 16px; font-weight: 700; text-shadow: 0 2px 6px #000; }
  .hud-objective { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); max-width: 46%; background: rgba(10,14,24,.72); padding: 8px 14px; border-radius: 6px; font-size: 14px; text-align: center; }
  .hud-speed { position: absolute; bottom: 44px; right: 18px; font-size: 30px; font-weight: 800; text-shadow: 0 2px 6px #000; }
  .hud-hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #cfd3d8; text-shadow: 0 1px 4px #000; white-space: nowrap; }
  .hud-toast { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); font-size: 16px; font-weight: 700; color: #ffcf3a; text-shadow: 0 2px 6px #000; }
  .hud-message { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); font-size: 15px; background: rgba(10,14,24,.8); padding: 8px 14px; border-radius: 6px; max-width: 60%; text-align: center; }
  .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 22px; color: #fff; text-shadow: 0 0 6px #000; }
  .minimap { position: absolute; left: 16px; bottom: 16px; width: 180px; height: 180px; border-radius: 50%; border: 2px solid #fff8; background: rgba(10,14,24,.6); }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(10,8,14,.55); pointer-events: auto; text-align: center; padding: 20px; }
  .screen.hidden { display: none; }
  .screen h1 { font-size: 64px; margin: 0 0 8px; letter-spacing: 6px; color: #ffcf3a; text-shadow: 0 4px 18px #000; }
  .screen .tag { max-width: 560px; font-size: 16px; color: #e8e0d0; }
  .screen .foot { font-size: 13px; color: #b9bec4; margin-top: 18px; }
  .btns { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; justify-content: center; }
  .screen button, .pause-body button { background: #ffcf3a; color: #1a1210; border: none; padding: 12px 22px; font-size: 16px; font-weight: 800; border-radius: 6px; cursor: pointer; }
  .screen button:hover { background: #ffd94c; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 10px 0; }
  .tabs .tab { background: #2b2f38; color: #fff; padding: 8px 14px; font-size: 14px; }
  .pause-body { max-width: 640px; max-height: 52vh; overflow: auto; text-align: left; background: rgba(10,14,24,.85); padding: 16px 20px; border-radius: 8px; font-size: 14px; }
  .pause-body .dim { color: #9aa3ad; }
  .pause-body p { margin: 6px 0; }
  .pause-body button { padding: 6px 12px; font-size: 13px; margin: 2px; }
  .bigmap { display: block; margin: 8px auto; border: 1px solid #fff3; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Bay 3D: an open-world crime game. Drive, steal cars, run missions and lose the police on a volcanic island city."></canvas>
<div id="ui"></div>
<p id="status" role="status" aria-live="polite"></p>
<script src="./vendor/three.min.js"></script>
<script src="./src/config.js"></script>
<script src="./src/audio.js"></script>
<script src="./src/world.js"></script>
<script src="./src/game.js"></script>
<script src="./src/shots.js"></script>
<script src="./src/main.js"></script>
</body>
</html>
